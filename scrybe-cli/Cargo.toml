[package]
name = "scrybe"
version = "1.4.0"
description = "Local-first meeting recording, transcription, and notes for macOS."
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["meeting", "transcription", "whisper", "local-first", "privacy"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "scrybe"
path = "src/main.rs"
doc = false

[features]
default = [
    "cli-shell",
    "hook-git",
    "mic-capture",
    "system-capture-mac",
    "encoder-opus",
    "whisper-local",
    "llm-openai-compat",
]
hook-git = ["scrybe-core/hook-git"]
whisper-local = ["scrybe-core/whisper-local"]
stt-sherpa = ["scrybe-core/stt-sherpa"]
# `scrybe mcp`: read-only local-agent access over `~/scrybe/` (M9).
# Off by default; forwards to `scrybe-core`'s feature of the same
# name, which itself carries no write/delete/mutate capability
# regardless of this flag — the feature only gates whether the stdio
# JSON-RPC/MCP surface compiles in at all. `tokio/io-std` is the
# existing `tokio` dependency's async stdin/stdout wrapper, enabled
# only for this feature (mirrors `system-capture-mac`'s conditional
# `tokio/process` below). No new dependency.
agent-access = ["scrybe-core/agent-access", "tokio/io-std"]
# Enables the live cpal binding in `scrybe-capture-mic` so
# `scrybe record --mic` opens the default input device. Included in
# the published macOS application's default feature set; hermetic
# development and CI builds disable all defaults explicitly. Without
# this feature, `--mic` returns
# `CaptureError::PermissionDenied("live-mic feature disabled ...")`.
mic-capture = ["scrybe-capture-mic/live-mic"]
# Enables both macOS system-audio adapters. `sck` is the default,
# using ScreenCaptureKit on macOS 13+; `tap` remains selectable on
# macOS 14.4+ for recovery and comparison. `tokio/process` supports
# the bundled legacy tap path only.
system-capture-mac = [
    "scrybe-capture-mac/core-audio-tap",
    "scrybe-capture-mac/system-capture-sck",
    "tokio/process",
]
# Enables the live `OggOpusEncoder` in `scrybe-core` so `audio.opus`
# is a real Ogg-Opus file (decodable by ffmpeg / vlc / browser audio
# tags) rather than the v0.1 NullEncoder raw-PCM fallback. Included in
# the published macOS application's default feature set.
encoder-opus = ["scrybe-core/encoder-opus"]
# Enables `OpenAiCompatLlmProvider` so `scrybe record --llm openai-compat`
# generates real `notes.md` summaries via any OpenAI-compat
# `/chat/completions` endpoint — Ollama at `http://localhost:11434/v1`,
# OpenAI, Groq, Together, vLLM, … (see `docs/system-design.md` §4.3,
# §8.2). Forwards to `scrybe-core/openai-compat`, which pulls
# `reqwest` with rustls-only TLS. Included in the published application;
# runtime configuration still controls whether any network provider runs.
llm-openai-compat = ["scrybe-core/openai-compat"]
# Desktop shell: tray-icon + global-hotkey wired to a main-thread event
# pump so `scrybe record --shell` toggles capture from a global hotkey
# and a status-bar Quit menu.
#
# Included by default for the supported macOS application. Cross-platform
# workspace validation uses `--no-default-features` because Linux requires
# GTK development headers and Windows/Linux recording remains parked.
cli-shell = [
    "dep:tray-icon",
    "dep:global-hotkey",
    "dep:keyboard-types",
    "dep:crossbeam-channel",
    "dep:core-foundation",
]

[dependencies]
anyhow = "1"
async-trait.workspace = true
chrono.workspace = true
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = { version = "0.5", optional = true }
directories.workspace = true
futures.workspace = true
global-hotkey = { version = "0.7", optional = true }
keyboard-types = { version = "0.8", optional = true }
scrybe-capture-mac = { package = "scrybe-meeting-capture-mac", path = "../scrybe-capture-mac", version = "=1.4.0" }
scrybe-capture-mic = { package = "scrybe-meeting-capture-mic", path = "../scrybe-capture-mic", version = "=1.4.0" }
scrybe-core = { package = "scrybe-meeting-core", path = "../scrybe-core", version = "=1.4.0" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.23", optional = true }
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", optional = true }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true

# Tarball generation for the `scrybe` application package is owned by
# cargo-dist. Library and parked-platform workspace packages stay opted out
# via the absence of this block.
#
# cargo-dist uses the package's default feature set, keeping the GitHub artifact
# and crates.io install on one production profile. Runtime configuration keeps
# network providers inactive until selected; the egress audit covers the
# explicit hermetic `--no-default-features` build.
[package.metadata.dist]
dist = true
default-features = true
