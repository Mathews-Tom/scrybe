[package]
name = "scrybe-cli"
version = "1.3.1"
description = "Command-line driver for scrybe: init, record, list, show, doctor."
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "scrybe"
path = "src/main.rs"
doc = false

[features]
default = []
hook-git = ["scrybe-core/hook-git"]
whisper-local = ["scrybe-core/whisper-local"]
stt-sherpa = ["scrybe-core/stt-sherpa"]
# `scrybe mcp`: read-only local-agent access over `~/scrybe/` (M9).
# Off by default; forwards to `scrybe-core`'s feature of the same
# name, which itself carries no write/delete/mutate capability
# regardless of this flag — the feature only gates whether the stdio
# JSON-RPC/MCP surface compiles in at all. `tokio/io-std` is the
# existing `tokio` dependency's async stdin/stdout wrapper, enabled
# only for this feature (mirrors `system-capture-mac`'s conditional
# `tokio/process` below). No new dependency.
agent-access = ["scrybe-core/agent-access", "tokio/io-std"]
# Enables the live cpal binding in `scrybe-capture-mic` so
# `scrybe record --mic` opens the default input device. Off by default
# so the cpal transitive dependency tree (CoreAudio / ALSA / WASAPI
# bindings) stays out of CI builds; users opt in via
# `cargo install --features mic-capture` per the v1.0.x mic-only path
# documented in `INSTALL.md`. Without this feature, `--mic` returns
# `CaptureError::PermissionDenied("live-mic feature disabled ...")`.
mic-capture = ["scrybe-capture-mic/live-mic"]
# Enables both macOS system-audio adapters. `sck` is the default,
# using ScreenCaptureKit on macOS 13+; `tap` remains selectable on
# macOS 14.4+ for recovery and comparison. `tokio/process` supports
# the bundled legacy tap path only.
system-capture-mac = [
    "scrybe-capture-mac/core-audio-tap",
    "scrybe-capture-mac/system-capture-sck",
    "tokio/process",
]
# Enables the live `OggOpusEncoder` in `scrybe-core` so `audio.opus`
# is a real Ogg-Opus file (decodable by ffmpeg / vlc / browser audio
# tags) rather than the v0.1 NullEncoder raw-PCM fallback. Off by
# default so the workspace builds without libopus headers.
encoder-opus = ["scrybe-core/encoder-opus"]
# Enables `OpenAiCompatLlmProvider` so `scrybe record --llm openai-compat`
# generates real `notes.md` summaries via any OpenAI-compat
# `/chat/completions` endpoint — Ollama at `http://localhost:11434/v1`,
# OpenAI, Groq, Together, vLLM, … (see `docs/system-design.md` §4.3,
# §8.2). Forwards to `scrybe-core/openai-compat`, which pulls
# `reqwest` with rustls-only TLS. Off by default so the air-gappable
# default-feature graph stays network-free per the egress audit
# (`scripts/check-egress-baseline.py`); enable on opt-in.
llm-openai-compat = ["scrybe-core/openai-compat"]
# Desktop shell: tray-icon + global-hotkey wired to a main-thread event
# pump so `scrybe record --shell` toggles capture from a global hotkey
# and a status-bar Quit menu.
#
# Default-OFF because the Linux build of `tray-icon` 0.23 needs GTK
# headers, which the GitHub-hosted `ubuntu-24.04` runner does not carry
# without an `apt install` step. A maintainer building for desktop
# distribution opts in via `cargo install --features cli-shell` (or per
# the release recipe in `.docs/development-plan.md` §13).
cli-shell = [
    "dep:tray-icon",
    "dep:global-hotkey",
    "dep:keyboard-types",
    "dep:crossbeam-channel",
    "dep:core-foundation",
]

[dependencies]
anyhow = "1"
async-trait.workspace = true
chrono.workspace = true
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = { version = "0.5", optional = true }
directories.workspace = true
futures.workspace = true
global-hotkey = { version = "0.7", optional = true }
keyboard-types = { version = "0.8", optional = true }
scrybe = { path = "../scrybe", version = "1.3.1" }
scrybe-capture-mac = { path = "../scrybe-capture-mac", version = "1.3.1" }
scrybe-capture-mic = { path = "../scrybe-capture-mic", version = "1.3.1" }
scrybe-core = { path = "../scrybe-core", version = "1.3.1" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.23", optional = true }
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", optional = true }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true

# Tarball generation for `scrybe-cli` is owned by cargo-dist. Other workspace
# crates (`scrybe`, `scrybe-core`, `scrybe-capture-mac`) are libraries or
# placeholders and stay opted out via the absence of this block.
#
# The macOS release artifact is the product, not a diagnostics-only CLI:
# it includes mic capture, Opus encoding, local Whisper, and the opt-in
# OpenAI-compatible provider needed for a local Ollama notes path. Config keeps
# every network provider opt-in; default configs and egress-audit builds remain
# feature-minimal.
[package.metadata.dist]
dist = true
features = [
    "cli-shell",
    "hook-git",
    "mic-capture",
    "system-capture-mac",
    "encoder-opus",
    "whisper-local",
    "llm-openai-compat",
]
default-features = true
