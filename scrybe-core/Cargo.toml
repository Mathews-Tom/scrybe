[package]
name = "scrybe-meeting-core"
version = "1.3.2"
description = "Core session, storage, provider, and pipeline library for the Scrybe meeting recorder."
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../README.md"

[lib]
name = "scrybe_core"

[features]
default = []
# Read-only local-agent access over `~/scrybe/` (M9,
# `.docs/DEVELOPMENT_PLAN.md` §6). Off by default: no write/delete/mutate
# capability exists in the `agent_access` module regardless of this
# feature, but the stdio JSON-RPC/MCP surface itself only compiles in
# when a consumer opts in. Adds no new dependency — built entirely on
# `serde_json`, `toml`, and `chrono`, already unconditional deps below.
agent-access = []
# Enables Hook::Git via git2 / libgit2. Off by default so the workspace
# builds without a system libgit2; enable it in the application package when
# the user turns on the [hooks.git] section in config.
hook-git = ["dep:git2"]
# Enables WhisperLocalProvider via whisper-rs (links libwhisper / Metal /
# BLAS depending on platform). Off by default so the workspace builds
# without a C++ toolchain; the application package enables this feature.
whisper-local = ["dep:whisper-rs"]
# Enables `SherpaStreamingProvider` through the official `sherpa-onnx`
# binding. Opt-in only: the workspace `.cargo/config.toml` requires a
# pre-provisioned native runtime and fails before sherpa-onnx can download one.
stt-sherpa = ["dep:sherpa-onnx"]
# OpenAI-compatible STT and LLM providers (Groq, OpenAI, Together,
# vLLM, …). Pulls in `reqwest` with rustls-only TLS; the
# `egress-audit` CI lane remains clean only when the application is
# checked with `--no-default-features`.
openai-compat = ["dep:reqwest", "dep:url"]
# `IcsFileProvider` — calendar context from local `.ics` files via
# the `ical` crate.
context-ics = ["dep:ical"]
# `WebhookHook` — async POST + HMAC-SHA256-signed payload to a
# configured URL.
# `sha2` itself is required unconditionally (see below — it also
# backs `testing::paired`'s checksum verification, which compiles on
# every feature set), so it is no longer listed as a `dep:` toggle
# here; enabling `hook-webhook` still needs the other four.
hook-webhook = ["dep:reqwest", "dep:url", "dep:hmac", "dep:hex"]
# `TantivyIndexerHook` — incremental local full-text index at
# `<storage.root>/.index/`. Local-only; never source-of-truth (the
# index is regenerable from session folders via `rebuild_all`). See
# `docs/system-design.md` §12.1.
hook-tantivy = ["dep:tantivy"]
# Enables the live `pyannote-onnx` runtime backend behind
# `PyannoteOnnxDiarizer`. Off by default so the workspace builds
# without an ONNX C++ toolchain; the trait surface and the cluster-to-
# attendee mapping are exercised by an in-tree stub backend so the
# selection and the routing logic remain testable on every PR. The
# live binding lands as a v0.5.x follow-up tracked in
# `.docs/development-plan.md` §11.2.
diarize-pyannote = []
# Enables the live `OggOpusEncoder` behind the existing `Encoder`
# trait in `scrybe-core::pipeline::encoder`. Anticipated since v0.5
# (see encoder.rs module docstring); landed at v1.0.2 to close the
# v0.1 carryover where `NullEncoder` wrote raw PCM under an `.opus`
# filename. Off by default so the workspace builds without libopus;
# the application package enables it in release builds. With the feature off,
# pipeline falls back to `NullEncoder` (the test-only deterministic
# implementation).
encoder-opus = ["dep:opus", "dep:ogg"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
directories.workspace = true
futures.workspace = true
git2 = { version = "0.19", default-features = false, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
ical = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# Required unconditionally: `hooks::webhook` uses it behind
# `hook-webhook`, and `testing::paired` (always compiled, no feature
# gate — see `testing/mod.rs`) uses it to verify each corpus clip's
# audio bytes against its manifest-declared checksum.
sha2.workspace = true
tantivy = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
# Unconditional — no feature flag. `notes_segments` (M7) must compile
# in every normal core build; only its future real-LLM preflight path
# (PR-2/PR-3) actually loads a tokenizer file.
tokenizers.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true
url = { workspace = true, optional = true }
whisper-rs = { version = "0.13", optional = true, default-features = false, features = ["whisper-cpp-tracing"] }
sherpa-onnx = { version = "=1.13.7", optional = true }
# Opus + Ogg deps for the `encoder-opus` feature. Both are local-only
# (no network surface), so they do not perturb the `egress-audit` CI
# lane; only pulled in when the consumer enables `encoder-opus`. The
# `opus` 0.4 uses the maintained `opusic-sys` bindings instead of the
# CMake-4-incompatible vendored build in `audiopus_sys` 0.2.2. `ogg`
# is pure Rust and writes the Ogg container framing required by RFC
# 7845 OpusHead / OpusTags.
opus = { version = "0.4", optional = true }
ogg = { version = "0.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
pretty_assertions = "1"
proptest = "1.5"
tempfile = "3"
tokio = { version = "1.42", features = ["macros", "net", "rt-multi-thread", "sync", "time", "test-util"] }
wiremock = { workspace = true }

# Pipeline-stage micro-benchmarks per `docs/system-design.md` §11 ("Bench
# gate") and `.docs/development-plan.md` §7.3.4. Run locally with
# `cargo bench -p scrybe-meeting-core`. CI gates only on `cargo bench --no-run`
# (compile) — the throughput-regression gate runs on the self-hosted
# Tier-3 Mac per `system-design.md` §11.
[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
