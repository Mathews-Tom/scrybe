# The desktop host is a workspace of its own. The root workspace's jobs
# build the library and CLI graph with `--no-default-features`; adding a
# WebView host to that graph would put `tauri` (and, on Linux, a system
# WebKitGTK) into every one of those jobs. The gate reaches this
# manifest explicitly with `--manifest-path` instead.
[workspace]
members = ["."]

[package]
name = "scrybe-desktop"
version = "2.1.0"
description = "Tauri host for the Scrybe desktop application"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Mathews Tom"]
repository = "https://github.com/Mathews-Tom/scrybe"
publish = false

[lib]
name = "scrybe_desktop"
crate-type = ["lib"]

[[bin]]
name = "scrybe-desktop"
path = "src/main.rs"

[features]
# On by default, because the shipped application offers an in-app model
# download and a build without this cannot perform one. It was default-
# off once, and that was the bug: nothing turned it on — not
# `tauri.conf.json`, not a build script, not a release pipeline — so
# the only artifact ever built with it was a qualification candidate,
# while a user who pressed `Download and verify this model` got told
# the build carried no transport and handed a `Try again` button that
# could never work.
default = ["model-download", "whisper-local", "notes-generation", "mic-capture"]
# The managed model transport.
#
# Enabling it is the only thing in this tree that turns on
# `scrybe-application`'s own default-off `model-download`, which that
# crate leaves off so its own egress baselines stay clean. It stays a
# named feature rather than an unconditional dependency so that
# `--no-default-features` still resolves a host with no HTTP client at
# all, which is what proves the gating is real rather than a label.
#
# `scripts/check-app-egress-baseline.py` pins both shapes: the shipped
# graph must carry exactly the approved transport and nothing more, and
# the graph with the feature off must carry none of it.
model-download = ["scrybe-application/model-download"]
# The configured notes provider `Regenerate notes` asks for. On by
# default, because the shipped application offers the action and a build
# without this carries no provider to answer it; still a named feature,
# so `--no-default-features` resolves a host with no HTTP client at all,
# which is what `scripts/check-app-egress-baseline.py` reads to prove
# the gating is real rather than a label.
notes-generation = ["scrybe-application/notes-generation"]
# The microphone this host records through. On by default, because the
# shipped application offers recording and a build without this can open
# nothing but the in-process synthetic source. It stays a named feature
# so `--no-default-features` resolves a host that links no audio device
# binding at all, which is what makes `recording::support` a statement
# about the build rather than a label — and a preflight on such a build
# refuses a microphone source instead of clearing one it cannot open.
mic-capture = ["scrybe-application/mic-capture"]
# The transcription runtime that loads the model this host downloads. On
# by default, because the shipped application offers `Download and
# verify this model` and a build without this could fetch 487 MB it has
# no way to load: the preflight would clear the download, then refuse
# the recording with "a whisper.cpp model file is configured, but this
# build carries no model runtime". The transport and the runtime that
# consumes what it fetched are two separate features, and shipping the
# first without the second is what made a fully-granted installation
# unable to record.
whisper-local = ["scrybe-application/whisper-local"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Already resolved in this graph by `scrybe-meeting-core`, which uses it
# to find the platform data directory, so naming it here unifies onto
# the same version and adds no crate to the audited surface. It is what
# resolves the home directory a `~`-prefixed storage root expands
# against.
directories = "5"
# Already resolved in this graph by `scrybe-meeting-core`, so naming it
# here unifies onto the same version and adds no crate to the audited
# surface. It is what ends a capture stream when a stop is accepted.
futures = { version = "0.3", default-features = false, features = ["std"] }
scrybe-application = { package = "scrybe-meeting-application", path = "../../scrybe-application" }
# Already in this graph through `scrybe-application`. Named here for the
# session identity and the start instant a recording is minted with,
# which the host supplies because a capture diagnostic written before a
# session starts has to name the folder that session will create.
scrybe-core = { package = "scrybe-meeting-core", path = "../../scrybe-core" }
# The native indicators, unpublished and shared with the command-line
# binary. This crate cannot inline the floating panel's `AppKit` calls
# at any price — `unsafe_code = "forbid"` below cannot be overridden by
# a local `#![allow]` — which is the whole reason the widgets are a
# crate rather than a module.
scrybe-widgets = { path = "../../scrybe-widgets" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
ts-rs = "12"
# `signal` for the terminating signals this host treats as a quit
# request rather than letting them end a recording mid-write, and
# `time` to pace the synthetic capture source to the wall clock a real
# device arrives on. `tokio` is
# already in this graph through `scrybe-application`; this feature set
# is a subset of what that dependency turns on plus `signal`.
tokio = { version = "1.42", default-features = false, features = ["macros", "rt", "signal", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# `toml` 0.8 is already resolved in this graph by `scrybe-application`
# and the `scrybe-meeting-core` beneath it, both of which depend on the
# workspace `toml`, so naming it here unifies onto `toml 0.8.23` and
# adds no crate to the audited surface. It is not `tauri-build` that
# supplies it: `tauri-utils` resolves `toml 1.1.6`, a different major
# that would not satisfy this requirement. The distinction is worth
# stating because this lockfile is now read by `cargo audit`, `cargo
# deny`, and `cargo vet`, which makes a claim about what a dependency
# costs a claim those gates are relied on to keep true.
#
# It is what lets `tests/capability_audit.rs` read a TOML capability
# file rather than skip one, which `tauri-utils` loads unconditionally.
[dev-dependencies]
tempfile = "3.27.0"
toml = "0.8"
# The mock runtime `tests/recording_stop.rs` drives the desktop entry
# points against, without a real `WebView`. Only widens features on the
# dependency already named above; it adds no crate this graph does not
# already carry.
tauri = { version = "2", features = ["test"] }
