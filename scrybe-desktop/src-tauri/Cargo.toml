# The desktop host is a workspace of its own. The root workspace's jobs
# build the library and CLI graph with `--no-default-features`; adding a
# WebView host to that graph would put `tauri` (and, on Linux, a system
# WebKitGTK) into every one of those jobs. The gate reaches this
# manifest explicitly with `--manifest-path` instead.
[workspace]
members = ["."]

[package]
name = "scrybe-desktop"
version = "0.0.0"
description = "Tauri host for the Scrybe desktop application"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Mathews Tom"]
repository = "https://github.com/Mathews-Tom/scrybe"
publish = false

[lib]
name = "scrybe_desktop"
crate-type = ["lib"]

[[bin]]
name = "scrybe-desktop"
path = "src/main.rs"

[features]
# On by default, because the shipped application offers an in-app model
# download and a build without this cannot perform one. It was default-
# off once, and that was the bug: nothing turned it on — not
# `tauri.conf.json`, not a build script, not a release pipeline — so
# the only artifact ever built with it was a qualification candidate,
# while a user who pressed `Download and verify this model` got told
# the build carried no transport and handed a `Try again` button that
# could never work.
default = ["model-download"]
# The managed model transport.
#
# Enabling it is the only thing in this tree that turns on
# `scrybe-application`'s own default-off `model-download`, which that
# crate leaves off so its own egress baselines stay clean. It stays a
# named feature rather than an unconditional dependency so that
# `--no-default-features` still resolves a host with no HTTP client at
# all, which is what proves the gating is real rather than a label.
#
# `scripts/check-app-egress-baseline.py` pins both shapes: the shipped
# graph must carry exactly the approved transport and nothing more, and
# the graph with the feature off must carry none of it.
model-download = ["scrybe-application/model-download"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scrybe-application = { package = "scrybe-meeting-application", path = "../../scrybe-application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
ts-rs = "12"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# `toml` 0.8 is already resolved in this graph by `scrybe-application`
# and the `scrybe-meeting-core` beneath it, both of which depend on the
# workspace `toml`, so naming it here unifies onto `toml 0.8.23` and
# adds no crate to the audited surface. It is not `tauri-build` that
# supplies it: `tauri-utils` resolves `toml 1.1.6`, a different major
# that would not satisfy this requirement. The distinction is worth
# stating because this lockfile is now read by `cargo audit`, `cargo
# deny`, and `cargo vet`, which makes a claim about what a dependency
# costs a claim those gates are relied on to keep true.
#
# It is what lets `tests/capability_audit.rs` read a TOML capability
# file rather than skip one, which `tauri-utils` loads unconditionally.
[dev-dependencies]
tempfile = "3.27.0"
toml = "0.8"
