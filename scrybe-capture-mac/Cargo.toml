[package]
name = "scrybe-capture-mac"
version = "1.2.1"
description = "macOS audio capture adapter for scrybe. Implements scrybe-core's AudioCapture trait via Core Audio Taps (macOS 14.4+) primary path with a ScreenCaptureKit fallback for 13.0–14.3."
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Enables the live Core Audio Taps binding via objc2. Requires macOS
# 14.4+ at runtime; building with this feature pulls objc2 and the
# CoreAudio framework. Off by default so the workspace can be type-
# checked on Linux/Windows hosts; the macOS CI lane and the release
# build flip it on.
#
# `dep:cpal` powers `probe_chime`'s in-process calibration chime for
# `scrybe doctor --check-tap` — playing it in-process (no `afplay`
# subprocess, no on-disk fixture file) is only meaningful alongside
# the live tap binding this feature enables.
core-audio-tap = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-core-audio",
    "dep:objc2-core-audio-types",
    "dep:block2",
    "dep:dispatch2",
    "dep:cpal",
]

# Enables the ScreenCaptureKit system-audio adapter on macOS 13.0+.
# The framework still requires a display-backed filter for audio-only
# capture, but the adapter requests a 2×2, 1 fps surface and consumes
# only its 16 kHz mono audio callback.
system-capture-sck = ["dep:screencapturekit"]

# Standalone diagnostic probe for Apple's `VoiceProcessingIO` audio
# unit (macOS's built-in AEC/NS voice-processing AudioUnit). This is
# NOT the `[record].aec` capture feature: it does not touch
# `NativeMicCapture`/`native_mic.rs` or any microphone stream, and it
# changes no capture behavior, config, default, or lifecycle. It only
# locates the `auou`/`vpio`/`appl` component, fully initializes an
# instance to establish runtime availability, and tears it down. See
# `voice_processing_io_probe` and
# `examples/voice_processing_io_probe.rs`. Independent of
# `core-audio-tap` so it can be probed without enabling the capture
# adapter.
voice-processing-io-probe = ["dep:objc2-audio-toolbox"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
scrybe-core = { path = "../scrybe-core", version = "1.2.1" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true }
objc2-core-audio = { workspace = true, optional = true }
objc2-core-audio-types = { workspace = true, optional = true }
block2 = { workspace = true, optional = true }
dispatch2 = { workspace = true, optional = true }
cpal = { version = "0.15", optional = true }
objc2-audio-toolbox = { workspace = true, optional = true }
screencapturekit = { version = "9.0.1", features = ["macos_13_0"], optional = true }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "test-util", "time"] }

[[example]]
name = "voice_processing_io_probe"
required-features = ["voice-processing-io-probe"]

[lints]
workspace = true
