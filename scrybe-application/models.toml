# The managed model catalog.
#
# Every field here is evidence, not a default a reader may adjust: the
# manager refuses to fetch anything whose bytes and digest do not match
# these values exactly, so a wrong entry installs nothing rather than
# installing the wrong thing. `source_url` is pinned to an immutable
# revision on purpose — a `resolve/main` URL names whatever the branch
# points at today, which no checked-in digest can describe.
#
# Validation lives in `src/models/manifest.rs` and runs over this file
# in a test, so a malformed or unpinned entry fails the build rather
# than the first download.

