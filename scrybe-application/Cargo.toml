[package]
name = "scrybe-meeting-application"
version = "1.6.0"
description = "Shared application services for the Scrybe meeting recorder: sessions, configuration, diagnostics, and recording."
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../README.md"

[lib]
name = "scrybe_application"

[features]
default = []
# Read-only local-agent access over the configured storage root. Off by
# default: the services carry no agent-reachable mutation regardless of
# this flag — `SessionReader` has no mutating method — but the stdio
# JSON-RPC/MCP surface itself only compiles in when a consumer opts in.
# Adds no dependency; built on `serde_json`, already a dependency below.
agent-access = []

[dependencies]
async-trait.workspace = true
chrono.workspace = true
scrybe-core = { package = "scrybe-meeting-core", path = "../scrybe-core", version = "=1.6.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true

[dev-dependencies]
pretty_assertions = "1"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
