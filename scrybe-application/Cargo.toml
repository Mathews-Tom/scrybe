[package]
name = "scrybe-meeting-application"
version = "1.6.0"
description = "Shared application services for the Scrybe meeting recorder: sessions, configuration, diagnostics, and recording."
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../README.md"

[lib]
name = "scrybe_application"

[features]
default = []
# Read-only local-agent access over the configured storage root. Off by
# default: the services carry no agent-reachable mutation regardless of
# this flag — `SessionReader` has no mutating method — but the stdio
# JSON-RPC/MCP surface itself only compiles in when a consumer opts in.
# Adds no dependency; built on `serde_json`, already a dependency below.
agent-access = []
# The HTTP transport managed model acquisition reads artifacts through.
# Off by default here, mirroring `scrybe-core`'s `openai-compat`: every
# other property of the manager — the confirmation gate, free-space
# preflight, cancellation, exact size and digest verification, atomic
# promotion, refusal to replace an installed artifact — is transport
# independent and is exercised in a build that carries no network crate
# at all, which is what the library and command-line egress baselines
# read. `scrybe-desktop/src-tauri`'s feature of the same name is what
# turns this on, and that one is on by default, because the shipped
# desktop application performs an in-app model download.
model-download = ["dep:reqwest"]
# The configured notes provider `ConfiguredNotesGenerator` talks to.
# Off by default for the same reason `model-download` is: the library
# egress baseline reads a graph with no network crate in it at all,
# and this feature is what buys the OpenAI-compatible client. With it
# off the generator still compiles and still refuses, so a frontend
# gets a stated reason rather than a missing command.
notes-generation = ["scrybe-core/openai-compat"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
reqwest = { workspace = true, optional = true }
scrybe-core = { package = "scrybe-meeting-core", path = "../scrybe-core", version = "=1.6.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true

[dev-dependencies]
pretty_assertions = "1"
tempfile.workspace = true
# `net` is what the local fixture server binds a listener with, exactly
# as `scrybe-core`'s provider tests do. A dev edge, invisible to the
# egress baselines, which resolve normal edges only.
tokio = { version = "1.42", features = ["macros", "net", "rt-multi-thread", "time"] }
# The same local fixture server `scrybe-core`'s provider tests use. A
# dev dependency, so it stays out of the graph the egress baselines
# read, which resolve normal edges only.
wiremock.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
