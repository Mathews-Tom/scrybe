[package]
name = "scrybe-meeting-application"
version = "1.6.0"
description = "Shared application services for the Scrybe meeting recorder: sessions, configuration, diagnostics, and recording."
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../README.md"

[lib]
