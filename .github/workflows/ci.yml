name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sherpa_archive: sherpa-onnx-v1.13.7-linux-x64-static-lib.tar.bz2
            sherpa_dir: sherpa-onnx-v1.13.7-linux-x64-static-lib
            sherpa_sha256: d1be7a69ac2b30120058d8302e624239a3064085383cfa47994a14fdc44c32d6
          - os: macos-26
            sherpa_archive: sherpa-onnx-v1.13.7-osx-arm64-static-lib.tar.bz2
            sherpa_dir: sherpa-onnx-v1.13.7-osx-arm64-static-lib
            sherpa_sha256: 126daa2e8c09a4c5d54dc985722c43bd22f598adc56445905b377454b1b27e38
          - os: windows-latest
            sherpa_archive: sherpa-onnx-v1.13.7-win-x64-static-MT-Release-lib.tar.bz2
            sherpa_dir: sherpa-onnx-v1.13.7-win-x64-static-MT-Release-lib
            sherpa_sha256: 04734146fb3a21a297604c586ea826346dbb167c19b9ccc79c1f85d39f490395
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The application and ordinary builds never download a native runtime:
      # .cargo/config.toml fails closed unless this job explicitly sets the
      # directory. CI fetches only the pinned upstream release asset and checks
      # GitHub's release SHA-256 before extraction.
      - name: provision Sherpa runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.sherpa_archive }}"
          for attempt in 1 2 3; do
            if curl --fail --location --output "$archive" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/${{ matrix.sherpa_archive }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$attempt"
          done
          echo "${{ matrix.sherpa_sha256 }}  $archive" | sha256sum --check
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          runtime_dir="$RUNNER_TEMP/${{ matrix.sherpa_dir }}/lib"
          test -d "$runtime_dir"
          echo "SHERPA_ONNX_LIB_DIR=$runtime_dir" >> "$GITHUB_ENV"
      - name: provision Sherpa runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.sherpa_archive }}"
          for attempt in 1 2 3; do
            if curl --fail --location --output "$archive" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/${{ matrix.sherpa_archive }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$attempt"
          done
          echo "${{ matrix.sherpa_sha256 }}  $archive" | shasum -a 256 --check
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          runtime_dir="$RUNNER_TEMP/${{ matrix.sherpa_dir }}/lib"
          test -d "$runtime_dir"
          echo "SHERPA_ONNX_LIB_DIR=$runtime_dir" >> "$GITHUB_ENV"
      - name: provision Sherpa runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP '${{ matrix.sherpa_archive }}'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/${{ matrix.sherpa_archive }}" -OutFile $archive -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) {
                throw
              }
              Start-Sleep -Seconds $attempt
            }
          }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne '${{ matrix.sherpa_sha256 }}'.ToUpperInvariant()) {
            throw "Sherpa runtime checksum mismatch"
          }
          tar -xjf $archive -C $env:RUNNER_TEMP
          $runtimeDir = Join-Path $env:RUNNER_TEMP '${{ matrix.sherpa_dir }}\lib'
          if (-not (Test-Path -PathType Container $runtimeDir)) {
            throw "Sherpa runtime library directory missing: $runtimeDir"
          }
          "SHERPA_ONNX_LIB_DIR=$runtimeDir" >> $env:GITHUB_ENV
      - name: cargo check (hermetic workspace)
        run: cargo check --workspace --all-targets --no-default-features
      - name: cargo clippy (hermetic workspace)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: cargo check (published macOS defaults)
        if: matrix.os == 'macos-26'
        run: cargo check -p scrybe --all-targets
      - name: cargo clippy (published macOS defaults)
        if: matrix.os == 'macos-26'
        run: cargo clippy -p scrybe --all-targets -- -D warnings
      - name: cargo check (Sherpa streaming provider)
        run: cargo check --workspace --all-targets --no-default-features --features stt-sherpa
      - name: cargo clippy (Sherpa streaming provider)
        run: cargo clippy --workspace --all-targets --no-default-features --features stt-sherpa -- -D warnings
      - name: cargo check (mac core-audio-tap feature)
        if: matrix.os == 'macos-26'
        run: cargo check -p scrybe-meeting-capture-mac --features core-audio-tap --all-targets
      - name: cargo clippy (mac core-audio-tap feature)
        if: matrix.os == 'macos-26'
        run: cargo clippy -p scrybe-meeting-capture-mac --features core-audio-tap --all-targets -- -D warnings
      - name: cargo test (hermetic lib, bin, integration, examples)
        run: cargo test --workspace --all-targets --no-default-features
      - name: cargo test (published macOS defaults)
        if: matrix.os == 'macos-26'
        run: cargo test -p scrybe --all-targets
      - name: cargo test (Sherpa streaming provider)
        run: cargo test --workspace --all-targets --no-default-features --features stt-sherpa
      # The model transport is default-off, so the hermetic run above
      # compiles neither it nor the local-fixture tests that corroborate
      # the zero-request property against a real HTTP client. Those are
      # a corroboration, not the property — `tests/model_acquisition.rs`
      # asserts the property itself in the hermetic build — but a leg
      # CI never compiles is a leg that rots.
      - name: cargo clippy (model transport)
        run: cargo clippy -p scrybe-meeting-application --all-targets --features model-download -- -D warnings
      - name: cargo test (model transport, local fixture server)
        run: cargo test -p scrybe-meeting-application --all-targets --features model-download
      - name: cargo test (mac core-audio-tap feature, ignored hardware tests skipped)
        if: matrix.os == 'macos-26'
        run: cargo test -p scrybe-meeting-capture-mac --features core-audio-tap --all-targets
      - name: cargo check (mac ScreenCaptureKit feature)
        if: matrix.os == 'macos-26'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo check -p scrybe-meeting-capture-mac --features system-capture-sck --all-targets
      - name: cargo clippy (mac ScreenCaptureKit feature)
        if: matrix.os == 'macos-26'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo clippy -p scrybe-meeting-capture-mac --features system-capture-sck --all-targets -- -D warnings
      - name: cargo test (mac ScreenCaptureKit feature)
        if: matrix.os == 'macos-26'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo test -p scrybe-meeting-capture-mac --features system-capture-sck --all-targets
      - name: cargo test (doc)
        run: cargo test --workspace --doc --no-default-features
      - name: cargo doc
        run: cargo doc --workspace --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit:
    name: audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install prebuilt cargo-audit via taiki-e/install-action so the
      # audit job is decoupled from the workspace toolchain bump cycle.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # `cargo-audit` reads `~/.cargo/audit.toml`, not the workspace-
      # root `audit.toml` we ship as documentation. Pass `--ignore`
      # on the CLI to enforce the same ignores. The workspace
      # `audit.toml` carries the canonical rationale for each entry;
      # keep both lists in sync when adding or dropping ignores.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2024-0421
      # The desktop host is a Cargo workspace of its own with its own
      # lockfile, so the step above — which reads `./Cargo.lock` — does
      # not see a single one of its crates. Without this step the
      # newest distributable binary in the repository would be the only
      # one exempt from RustSec advisory scanning.
      #
      # The ignore is the same identifier as the step above, but not for
      # the same reason, and `audit.toml` now records both. On this
      # graph RUSTSEC-2024-0421 is reached at run time through
      # `tauri -> url 2.5.0 -> idna 0.5.0` rather than through the
      # `Hook::Git` chain the root-graph entry reasons about, and the
      # escalation the advisory describes — a host-name comparison used
      # as a privilege check — is the shape of the desktop navigation
      # guard. Without the ignore this step fails: it is a
      # vulnerability-class advisory here, not a warning. What bounds it
      # is in `audit.toml`; what removes it is the `url 2.5.4` update
      # both graphs are waiting on.
      - name: cargo audit (desktop host)
        run: cargo audit --file scrybe-desktop/src-tauri/Cargo.lock --ignore RUSTSEC-2024-0421

  deny:
    name: deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          arguments: --all-features
      # The same policy file applied to the desktop host's own
      # workspace. `manifest-path` selects the graph; `--config` keeps
      # the licence allow-list, the advisory ignore list, and the source
      # allow-list a single file rather than a second copy that can
      # drift. The action defaults `manifest-path` to `./Cargo.toml`, so
      # the step above covers the root graph and nothing else.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./scrybe-desktop/src-tauri/Cargo.toml
          command: check advisories licenses bans sources
          arguments: --all-features --config ./deny.toml

  vet:
    name: vet (cargo-vet supply-chain — advisory)
    runs-on: ubuntu-latest
    # Advisory through v1.0. `cargo-vet` was wired up at v0.9.0-rc1
    # with standard upstream import feeds (Mozilla / Embark / Google /
    # Bytecode Alliance / ISRG / Zcash). Direct-dep audit entries land
    # incrementally through the v1.0.x stream; the lane stays
    # informational so a missing audit does not block PRs while the
    # maintainer works through the dependency graph. Promotion to a
    # blocking gate is the v1.0.x → v1.1 deliverable per
    # `.docs/development-plan.md` §13.1 ("cargo-vet audits committed
    # for every direct dep") and `MAINTENANCE.md` §5.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.0
      # The runner exit-codes vet outputs and converts a non-zero
      # result into a `::warning::` annotation rather than a job
      # failure. Job-level `continue-on-error` makes the *workflow*
      # pass but leaves the *PR check* red, which reads as "broken"
      # in the GitHub UI; wrapping in a script keeps the surface
      # green while preserving the advisory signal in the workflow
      # log. Remove the wrapper at v1.0 when the lane flips to
      # blocking.
      - name: cargo vet check --locked (advisory)
        run: |
          set +e
          cargo vet check --locked
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=cargo-vet advisory::cargo vet check exited $rc; see supply-chain/audits.toml for the v0.9.x audit-pass plan"
          fi
          exit 0
      # The desktop host's graph, through the same store. `--store-path`
      # points the run at the repository's one `supply-chain/`
      # directory, so an audit written once counts for both graphs and
      # there is no second audit set to keep in step. Advisory on the
      # same terms as the step above, and for the same reason: the
      # audit pass is incremental. Without this step the desktop graph
      # would not appear in the lane's output at all, so its unaudited
      # crates would be invisible rather than merely unaudited.
      # Advisory on both graphs means 472 unvetted crates in the desktop
      # graph and 397 in the root graph today. Neither number blocks a
      # merge; both are the audit-pass backlog, not a clean result.
      - name: cargo vet check --locked (desktop host, advisory)
        run: |
          set +e
          cargo vet check --locked \
            --manifest-path scrybe-desktop/src-tauri/Cargo.toml \
            --store-path supply-chain
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=cargo-vet advisory (desktop)::cargo vet check exited $rc for the desktop host graph; see supply-chain/audits.toml for the v0.9.x audit-pass plan"
          fi
          exit 0

  loc-budget:
    name: loc-budget (per-crate ceilings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: tokei
      - name: enforce per-crate LoC ceilings
        run: python3 scripts/check-loc-budget.py

  egress-audit:
    name: egress-audit (no-default-feature graph has no network crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: assert no network crates in scrybe hermetic build
        run: python3 scripts/check-egress-baseline.py

  # The desktop frontend is platform-independent, so it runs on the
  # cheapest leg. It deliberately does not build the Tauri host: doing so
  # on Linux would need a system WebKitGTK and would amount to claiming
  # Linux support the capture adapters do not yet have.
  desktop-frontend:
    name: desktop-frontend (pnpm typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scrybe-desktop/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        run: pnpm --dir scrybe-desktop install --frozen-lockfile
      - name: pnpm typecheck
        run: pnpm --dir scrybe-desktop typecheck
      - name: pnpm lint
        run: pnpm --dir scrybe-desktop lint
      - name: pnpm test
        run: pnpm --dir scrybe-desktop test
      - name: pnpm build
        run: pnpm --dir scrybe-desktop build
      # Pure JSON and manifest inspection, so it needs no WebView
      # toolchain and belongs on the cheap leg.
      - name: capability audit
        run: pnpm --dir scrybe-desktop run check:capabilities
      # What this job does NOT do: audit the packages it just installed.
      # `scrybe-desktop/pnpm-lock.yaml` resolves 624 packages, and no
      # job on any branch scans them for advisories or checks their
      # licences — `cargo audit`, `cargo deny`, and `cargo vet` all read
      # Cargo graphs and see none of it. That surface is build-time and
      # test-time only, because the shipped bundle carries the built
      # assets rather than `node_modules`, but a compromised build
      # dependency is how built assets are tampered with. Closing it
      # means a scanner this repository does not run yet, so the gap is
      # recorded here rather than implied by the list of steps above.

  # macOS is the only target this application ships to, and the Tauri
  # host is the only part of the tree that needs a WebView toolchain.
  # The root workspace's `build` matrix cannot see this manifest, so the
  # host gets its own explicit `--manifest-path` job.
  desktop-host:
    name: desktop-host (Tauri host on macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scrybe-desktop/src-tauri
      # `check:bindings` is a pnpm script so the documented gate command
      # is the one continuous integration runs, rather than a hand-copied
      # cargo invocation that can drift from it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scrybe-desktop/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        run: pnpm --dir scrybe-desktop install --frozen-lockfile
      - name: cargo fmt --check (desktop host)
        run: cargo fmt --manifest-path scrybe-desktop/src-tauri/Cargo.toml --check
      - name: cargo check (desktop host)
        run: cargo check --manifest-path scrybe-desktop/src-tauri/Cargo.toml --all-targets --locked
      - name: cargo clippy (desktop host)
        run: cargo clippy --manifest-path scrybe-desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: cargo test (desktop host)
        run: cargo test --manifest-path scrybe-desktop/src-tauri/Cargo.toml --all-targets --locked
      # The debug-only lifecycle channel compiles to a different
      # expansion in a release build, so checking only the debug profile
      # would leave half of it unbuilt — and the half that ships.
      - name: cargo check (desktop host, release profile)
        run: cargo check --manifest-path scrybe-desktop/src-tauri/Cargo.toml --release --bin scrybe-desktop --locked
      # The model transport is behind a default-off feature, so every
      # step above compiles the host without it. This is the one step
      # that builds the shape the setup qualification runs.
      - name: cargo clippy (desktop host, model transport enabled)
        run: cargo clippy --manifest-path scrybe-desktop/src-tauri/Cargo.toml --all-targets --locked --features model-download -- -D warnings
      # Asserts the default host graph carries no networking crate, the
      # feature-on graph carries exactly the approved transport, and the
      # model catalog names only the approved destination. Runs here
      # because it resolves the desktop workspace, which the root
      # `egress-audit` job cannot see.
      - name: app egress baseline
        run: python3 scripts/check-app-egress-baseline.py
      # Regenerates the TypeScript contract from the Rust one and fails
      # when the checked-in file differs, so it needs the Rust host and
      # therefore runs here rather than on the frontend leg.
      - name: generated contract freshness
        run: pnpm --dir scrybe-desktop run check:bindings

  bench-compile:
    name: bench-compile (criterion harness builds clean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `cargo bench --no-run` builds every `[[bench]]` target without
      # running it. The full Tier-3 throughput-regression gate
      # (`docs/system-design.md` §11) lives on the self-hosted Mac
      # runner; GitHub-hosted CPUs are too noisy for absolute numbers.
      # This job catches bench bitrot — a refactor that breaks the
      # benchmark harness — on every PR.
      - name: cargo bench --no-run (hermetic workspace)
        run: cargo bench --workspace --no-run --no-default-features
      - name: cargo clippy on hermetic benches
        run: cargo clippy --workspace --benches --no-default-features -- -D warnings

  dist-plan:
    name: dist-plan (cargo-dist config valid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@0.25.1
      # Package together because the current internal dependency versions do
      # not exist in crates.io until each release publishes them first.
      - name: package crates.io graph
        run: >-
          cargo package
          -p scrybe-meeting-core
          -p scrybe-meeting-application
          -p scrybe-meeting-capture-mac
          -p scrybe-meeting-capture-mic
          -p scrybe
          --locked
          --no-verify
      # cargo-dist 0.25 ships its binary as `dist`, not `cargo-dist`, so
      # `cargo dist plan` fails with "no such command: dist".
      - name: dist plan
        run: dist plan --output-format=human

  coverage:
    name: coverage (hermetic workspace + scrybe-meeting-core gate)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21
      - name: hermetic workspace coverage gate (>= 80% lines)
        run: cargo llvm-cov --workspace --no-default-features --fail-under-lines 80 --summary-only
      - name: scrybe-meeting-core coverage gate (>= 90% lines)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --package scrybe-meeting-core --no-default-features --fail-under-lines 90 --summary-only
      - name: emit lcov for upload
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-default-features --lcov --output-path lcov.info --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
