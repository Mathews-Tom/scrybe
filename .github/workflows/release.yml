# Release workflow for the `scrybe` application driven by cargo-dist 0.25.
#
# Trigger:
# - Push of a tag matching `v[0-9]+.[0-9]+.[0-9]+*` (e.g. v0.1.0, v0.1.0-rc1).
# - `workflow_dispatch` for dry-run validation; the dispatch path runs `plan`,
#   `build`, artifact staging, SBOM generation, checksum creation, and cosign
#   signing, but does NOT create a GitHub Release.
#
# Outputs:
# - cargo-dist CLI archives and installer for both macOS architectures
# - community-signed Scrybe DMGs for Apple silicon and Intel Macs
# - independently signed Tauri updater archives plus `latest.json`
# - SHA-256 manifests, CycloneDX SBOMs, and keyless Sigstore provenance
#
# The native application uses the stable self-signed identity declared in
# `packaging/macos-app/community-release.json`. It is deliberately not
# Apple-notarized, so the release gate requires Gatekeeper rejection rather
# than presenting the artifact as Apple-trusted.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write
  # `id-token: write` is required by `sigstore/cosign-installer` so the
  # release job can mint a short-lived OIDC token tied to this workflow
  # run. Cosign uses that token to obtain a Fulcio-issued certificate
  # and signs each release artifact keylessly. The certificate's SAN
  # records `https://github.com/Mathews-Tom/scrybe/.github/workflows/release.yml@<ref>`
  # so a downstream `cosign verify-blob` invocation can prove the asset
  # came from this workflow on this commit, without scrybe having to
  # manage a private key. See `INSTALL.md` "Verify a release with cosign".
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_DIST_VERSION: "0.25.1"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
      is-release: ${{ steps.resolve-tag.outputs.is-release }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve tag
        id: resolve-tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dispatch-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist-plan
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@${{ env.CARGO_DIST_VERSION }}
      # cargo-dist 0.25 ships its binary as `dist`, not `cargo-dist`, so
      # `cargo dist <subcmd>` fails with "no such command: dist". Invoke
      # the binary directly. Same pattern applies to `dist build` below.
      - name: dist plan
        run: dist plan --output-format=human
      # `dist plan --output-format=json` emits the canonical
      # `dist-manifest.json` schema (cargo-dist-schema) without a build —
      # planning is enough to enumerate every artifact this release will
      # produce. Captured here (not in `build`/`release`) because `plan`
      # is the one job that runs once per release rather than once per
      # target, so the manifest reflects the whole release, not a single
      # target's local artifacts.
      - name: dist manifest
        run: dist plan --output-format=json > dist-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist-manifest
          path: dist-manifest.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.target }})
    needs: plan
    # apple-metal 0.8.8 requires Metal APIs from the current macOS SDK.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      # Pin archive mtimes and strip runner-specific workspace paths from
      # emitted DWARF and panic strings. Keep the linker's LC_UUID: current
      # macOS dyld rejects executables without that load command. The
      # reproducibility lane therefore remains advisory for UUID variance.
      SOURCE_DATE_EPOCH: "1714464000"
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dist-build-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@${{ env.CARGO_DIST_VERSION }}
      - name: dist build
        run: dist build --artifacts=local --target=${{ matrix.target }}
      - name: list artifacts
        run: ls -la target/distrib/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/distrib/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: desktop (${{ matrix.target }})
    needs: plan
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_arch: aarch64
          - target: x86_64-apple-darwin
            asset_arch: x86_64
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TARGET: ${{ matrix.target }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scrybe-desktop/src-tauri -> target
          shared-key: desktop-release-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm
          cache-dependency-path: scrybe-desktop/pnpm-lock.yaml
      - name: install frontend dependencies
        run: pnpm --dir scrybe-desktop install --frozen-lockfile
      - name: import community signing identity
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected_identity="$(python3 -c 'import json; print(json.load(open("packaging/macos-app/community-release.json"))["identity"])')"
          [ -n "$APPLE_CERTIFICATE" ] || { echo "::error::APPLE_CERTIFICATE is not configured"; exit 1; }
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || { echo "::error::APPLE_CERTIFICATE_PASSWORD is not configured"; exit 1; }
          [ "$APPLE_SIGNING_IDENTITY" = "$expected_identity" ] || {
            echo "::error::APPLE_SIGNING_IDENTITY does not match the community release policy"
            exit 1
          }
          certificate_path="$RUNNER_TEMP/community-signing.p12"
          keychain_path="$RUNNER_TEMP/community-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
      - name: build signed application artifacts
        run: |
          set -euo pipefail
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured"; exit 1; }
          # Tauri's APPLE_CERTIFICATE importer only recognizes Apple-issued
          # certificate names. Use the self-signed identity imported above.
          env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD \
            pnpm --dir scrybe-desktop exec tauri build --target "$TARGET"
      - name: verify and stage application artifacts
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("scrybe-desktop/src-tauri/tauri.conf.json"))["version"])')"
          bundle_root="scrybe-desktop/src-tauri/target/$TARGET/release/bundle"
          bundle="$bundle_root/macos/Scrybe.app"
          archive="$bundle_root/macos/Scrybe.app.tar.gz"
          signature="$archive.sig"
          dmgs=("$bundle_root"/dmg/*.dmg)
          [ -d "$bundle" ] || { echo "::error::missing app bundle at $bundle"; exit 1; }
          [ -f "$archive" ] || { echo "::error::missing updater archive at $archive"; exit 1; }
          [ -s "$signature" ] || { echo "::error::missing updater signature at $signature"; exit 1; }
          [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ] || {
            echo "::error::expected exactly one DMG under $bundle_root/dmg"
            exit 1
          }
          python3 scripts/check-community-artifact.py \
            --bundle "$bundle" \
            --dmg "${dmgs[0]}"
          stage="$RUNNER_TEMP/desktop-staging"
          mkdir -p "$stage"
          cp "$archive" "$stage/Scrybe_${version}_${ASSET_ARCH}.app.tar.gz"
          cp "$signature" "$stage/Scrybe_${version}_${ASSET_ARCH}.app.tar.gz.sig"
          cp "${dmgs[0]}" "$stage/Scrybe_${version}_${ASSET_ARCH}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/desktop-staging/*
          if-no-files-found: error
          retention-days: 7
      - name: delete temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/community-signing.keychain-db" || true

  release:
    name: release
    needs: [plan, build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-staging
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dist-manifest
          path: dist-staging
      - uses: actions/download-artifact@v4
        with:
          path: dist-staging
          pattern: desktop-*
          merge-multiple: true
      - name: list staged artifacts
        run: ls -la dist-staging/
      # cargo-dist splits artifacts into "local" (per-target tarballs, built by
      # the matrix above) and "global" (cross-target outputs — installer
      # script, dist-manifest.json). The build matrix only emits local; the
      # shell installer asset that `INSTALL.md` and `README.md` document as
      # the quick-install path comes out of `dist build --artifacts=global`.
      # Run it here on the release runner and stage its output alongside the
      # downloaded tarballs so a single `gh release create` glob picks
      # everything up.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@${{ env.CARGO_DIST_VERSION }},cargo-cyclonedx@0.5.7
      - uses: sigstore/cosign-installer@v3.8.2
        with:
          cosign-release: v2.4.1
      - name: dist build (global artifacts)
        run: dist build --artifacts=global
      - name: stage global artifacts alongside tarballs
        run: |
          ls -la target/distrib/
          cp -v target/distrib/* dist-staging/
      - name: generate updater manifest
        env:
          IS_RELEASE: ${{ needs.plan.outputs.is-release }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("scrybe-desktop/src-tauri/tauri.conf.json"))["version"])')"
          if [ "$IS_RELEASE" = "true" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match application version v$version"
            exit 1
          fi
          for arch in aarch64 x86_64; do
            [ -f "dist-staging/Scrybe_${version}_${arch}.dmg" ] || {
              echo "::error::missing ${arch} DMG"
              exit 1
            }
            [ -f "dist-staging/Scrybe_${version}_${arch}.app.tar.gz" ] || {
              echo "::error::missing ${arch} updater archive"
              exit 1
            }
            [ -s "dist-staging/Scrybe_${version}_${arch}.app.tar.gz.sig" ] || {
              echo "::error::missing ${arch} updater signature"
              exit 1
            }
          done
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/generate-updater-manifest.py \
            --version "$version" \
            --notes "Scrybe $version" \
            --published-at "$published_at" \
            --output dist-staging/latest.json \
            --platform darwin-aarch64 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/Scrybe_${version}_aarch64.app.tar.gz" \
              "dist-staging/Scrybe_${version}_aarch64.app.tar.gz.sig" \
            --platform darwin-x86_64 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/Scrybe_${version}_x86_64.app.tar.gz" \
              "dist-staging/Scrybe_${version}_x86_64.app.tar.gz.sig"
      # Generate separate CycloneDX documents for the CLI and native desktop
      # host: their lockfiles and dependency graphs are intentionally distinct.
      - name: generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path scrybe-cli/Cargo.toml --format json --override-filename scrybe-sbom
          cli_sbom="$(find scrybe-cli -type f \( \
            -name scrybe-sbom \
            -o -name scrybe-sbom.json \
            -o -name scrybe-sbom.cdx.json \
            -o -name bom.json \
          \) -print -quit)"
          [ -n "$cli_sbom" ] || { echo "::error::missing CLI SBOM"; exit 1; }
          mv "$cli_sbom" dist-staging/scrybe-sbom.cdx.json

          cargo cyclonedx --manifest-path scrybe-desktop/src-tauri/Cargo.toml --format json --override-filename scrybe-desktop-sbom
          desktop_sbom="$(find scrybe-desktop/src-tauri -type f \( \
            -name scrybe-desktop-sbom \
            -o -name scrybe-desktop-sbom.json \
            -o -name scrybe-desktop-sbom.cdx.json \
            -o -name bom.json \
          \) -print -quit)"
          [ -n "$desktop_sbom" ] || { echo "::error::missing desktop SBOM"; exit 1; }
          mv "$desktop_sbom" dist-staging/scrybe-desktop-sbom.cdx.json
          ls -la dist-staging/*.cdx.json
      - name: write SHA256 manifest
        working-directory: dist-staging
        run: |
          set -euo pipefail
          shopt -s nullglob
          : > SHA256SUMS.txt
          for f in *.dmg *.tar.* *.zip *.sh *.json; do
            [ -e "$f" ] || continue
            shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
      # Cosign keyless signing covers the checksum manifest and both standalone
      # SBOMs. Publish the signature, Fulcio certificate, and Sigstore bundle.
      - name: cosign sign release manifest + SBOMs
        working-directory: dist-staging
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for asset in SHA256SUMS.txt scrybe-sbom.cdx.json scrybe-desktop-sbom.cdx.json; do
            [ -e "$asset" ] || { echo "::error::missing $asset"; exit 1; }
            cosign sign-blob \
              --output-signature "${asset}.sig" \
              --output-certificate "${asset}.pem" \
              --bundle "${asset}.bundle" \
              "$asset"
          done
          ls -la *.sig *.pem *.bundle
      - name: gh release create
        if: needs.plan.outputs.is-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Route the resolved tag through env so bash dereferences a variable
          # rather than having `${{ }}` template-substitution splice it into
          # the script body. Inline interpolation of a value an attacker can
          # influence (a tag name) is the textbook GitHub Actions command-
          # injection vector — the tag-pattern filter does not constrain
          # shell metacharacters because `*` matches them.
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # `dist-staging/*` would also match the unpacked
          # `scrybe-<target>/` working directories cargo-dist leaves
          # in target/distrib alongside the tarballs. `gh release create`
          # rejects directory paths with "is a directory" — the v0.1.0
          # first-attempt run hit exactly that. Restrict the upload to
          # regular files at depth 1 via `find -type f`.
          mapfile -t ASSETS < <(find dist-staging -maxdepth 1 -type f)
          printf 'staging file: %s\n' "${ASSETS[@]}"
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${ASSETS[@]}"
